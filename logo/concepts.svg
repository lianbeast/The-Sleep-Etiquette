<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="840" viewBox="0 0 1600 840"><defs><filter id="grey"><feColorMatrix type="saturate" values="0"/></filter></defs><rect width="1600" height="840" fill="#f7f7f4"/><text x="60" y="78" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#161616">Logo concepts</text><text x="60" y="116" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#6b6b6b">Concepts for review — pick a direction (or tell me what you like in each).</text><rect x="60" y="150" width="474.667" height="630" rx="18" fill="#fff" stroke="#161616" stroke-width="2"/><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="90" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet">
  <title>Concept A — Monogram</title>
  <desc>A serif E/T ligature in a disc. "Etiquette" is the word that distinguishes the label; the mark is its initial, with the top arm spanning to hint at the T of "The".</desc>
  <rect width="256" height="256" fill="#FFFFFF"/>
  <circle cx="128" cy="128" r="104" fill="none" stroke="#222222" stroke-width="6"/>
  <!-- spine (shared by E and the T's stem) -->
  <rect x="120" y="50" width="16" height="156" rx="3" fill="#222222"/>
  <!-- top arm = E's top arm + T's crossbar, full width -->
  <rect x="50" y="50" width="176" height="18" rx="2" fill="#222222"/>
  <!-- middle arm -->
  <rect x="120" y="110" width="70" height="18" rx="2" fill="#222222"/>
  <!-- bottom arm -->
  <rect x="120" y="170" width="106" height="18" rx="2" fill="#222222"/>
  <!-- slab serifs at arm ends and spine foot -->
  <rect x="42" y="46" width="16" height="26" rx="2" fill="#222222"/>
  <rect x="218" y="46" width="16" height="26" rx="2" fill="#222222"/>
  <rect x="218" y="106" width="16" height="26" rx="2" fill="#222222"/>
  <rect x="218" y="166" width="16" height="26" rx="2" fill="#222222"/>
  <rect x="112" y="198" width="32" height="14" rx="2" fill="#222222"/>
  <rect x="112" y="40" width="32" height="14" rx="2" fill="#222222"/>
</svg></g><g filter="url(#grey)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="90" y="516" width="64" height="64" preserveAspectRatio="xMidYMid meet">
