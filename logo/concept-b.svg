<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Concept B — The Rule</title>
  <desc>"Etiquette" is a code of rules. The mark is a single elegant horizontal rule — the brand's own divider line — with a serifed terminal and one break, punctuated by a dot at the near end like a sentence.</desc>
  <rect width="256" height="256" fill="#FFFFFF"/>
  <!-- thin frame -->
  <rect x="30" y="30" width="196" height="196" rx="2" fill="none" stroke="#222222" stroke-width="2"/>
  <!-- the rule, with a serif terminal at left -->
  <rect x="64" y="122" width="12" height="14" rx="1" fill="#222222"/>
  <rect x="76" y="125" width="120" height="8" rx="1" fill="#222222"/>
  <!-- the break -->
  <rect x="196" y="125" width="16" height="8" rx="1" fill="#222222"/>
  <!-- the dot (sentence punctus) at the near end -->
  <circle cx="60" cy="132" r="7" fill="#222222"/>
  <!-- a second, shorter rule below — the "standard" repeated -->
  <rect x="64" y="162" width="8" height="12" rx="1" fill="#222222"/>
  <rect x="72" y="165" width="100" height="6" rx="1" fill="#222222"/>
  <rect x="172" y="165" width="12" height="6" rx="1" fill="#222222"/>
</svg>