      <script>
        (() => {
          const root = document.getElementById('scene-collection-root');
          const $ = (selector) => root.querySelector(selector);
          const tl = gsap.timeline({ paused: true });
          tl.addLabel('six-shades', 0);
          tl.fromTo($('#collection-surface'), { opacity: 0 }, { opacity: 1, duration: .42, ease: 'sine.inOut' }, 0);
          tl.fromTo($('#collection-headline'), { x: -18, opacity: 0 }, { x: 0, opacity: 1, duration: .68, ease: 'power2.out' }, .09);
          const portraits = ['matcha', 'butter', 'milk', 'cocoa', 'sky', 'petal'];
          const arrivals = [.95, 1.61, 2.17, 2.70, 3.25, 3.80];
          portraits.forEach((shade, index) => {
            tl.fromTo($('#portrait-' + shade), { opacity: 0, y: 28, scale: .975 }, { opacity: 1, y: 0, scale: 1, duration: .52, ease: 'power2.out' }, arrivals[index]);
            tl.fromTo($('#portrait-' + shade + ' img'), { scale: 1.024 }, { scale: 1, duration: 6.54 - arrivals[index], ease: 'none' }, arrivals[index]);
          });
          tl.fromTo($('#collection-surface'), { opacity: 1, x: 0 }, { opacity: 0, x: -18, duration: .58, ease: 'sine.inOut', immediateRender: false }, 6.24);
          const warmth = $('#collection-warmth');
          const audioData = window.AUDIO_DATA;
          const audioOffsetFrames = Math.floor(4.39 * audioData.fps);
          function drawAudio(frame) { warmth.style.opacity = String(.12 + frame.rms * .04); }
          const localFrames = Math.min(Math.ceil(6.82 * audioData.fps), audioData.totalFrames - audioOffsetFrames);
          for (let frame = 0; frame < localFrames; frame++) tl.call(() => drawAudio(audioData.frames[audioOffsetFrames + frame]), [], frame / audioData.fps);
          tl.eventCallback('onUpdate', () => drawAudio(audioData.frames[Math.min(audioData.totalFrames - 1, Math.floor(4.39 * audioData.fps + tl.time() * audioData.fps))]));
          drawAudio(audioData.frames[audioOffsetFrames]);
          window.__timelines = window.__timelines || {};
          window.__timelines['scene-collection'] = tl;
