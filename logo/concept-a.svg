<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Concept A — Monogram</title>
  <desc>A serif E/T ligature in a disc. "Etiquette" is the word that distinguishes the label; the mark is its initial, with the top arm spanning to hint at the T of "The".</desc>
  <rect width="256" height="256" fill="#FFFFFF"/>
  <circle cx="128" cy="128" r="104" fill="none" stroke="#222222" stroke-width="6"/>
  <!-- spine (shared by E and the T's stem) -->
  <rect x="120" y="50" width="16" height="156" rx="3" fill="#222222"/>
  <!-- top arm = E's top arm + T's crossbar, full width -->
  <rect x="50" y="50" width="176" height="18" rx="2" fill="#222222"/>
  <!-- middle arm -->
  <rect x="120" y="110" width="70" height="18" rx="2" fill="#222222"/>
  <!-- bottom arm -->
  <rect x="120" y="170" width="106" height="18" rx="2" fill="#222222"/>
  <!-- slab serifs at arm ends and spine foot -->
  <rect x="42" y="46" width="16" height="26" rx="2" fill="#222222"/>
  <rect x="218" y="46" width="16" height="26" rx="2" fill="#222222"/>
  <rect x="218" y="106" width="16" height="26" rx="2" fill="#222222"/>
  <rect x="218" y="166" width="16" height="26" rx="2" fill="#222222"/>
  <rect x="112" y="198" width="32" height="14" rx="2" fill="#222222"/>
  <rect x="112" y="40" width="32" height="14" rx="2" fill="#222222"/>
</svg>